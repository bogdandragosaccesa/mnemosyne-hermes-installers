<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  .wrap { display:inline-block; }
  svg { display:block; overflow:visible; }
  text { font-family: inherit; fill: var(--foreground); }
  .lbl   { font-size: 13px; font-weight: 600; }
  .sub   { font-size: 10.5px; fill: var(--muted-foreground); }
  .tiny  { font-size: 9.5px;  fill: var(--muted-foreground); }
  .hdr   { font-size: 11px; font-weight: 700; fill: var(--muted-foreground); letter-spacing:.08em; }
  .box   { fill: var(--card); stroke: var(--border); stroke-width:1; rx:7; }
  .entry { fill: var(--card); stroke: var(--accent); stroke-width:2.5; rx:7; }
  .board { fill: var(--card); stroke: var(--accent); stroke-width:1.6; rx:7; }
  .lane  { fill: var(--muted-foreground); opacity:.045; rx:9; }
  .flow  { stroke: var(--accent); stroke-width:2; fill:none; marker-end:url(#a); }
  .back  { stroke: var(--muted-foreground); stroke-width:1.6; fill:none; marker-end:url(#b); stroke-dasharray:5 4; }
  .peer  { stroke: var(--foreground); stroke-width:1.6; fill:none; marker-end:url(#c); opacity:.65; }
  .read  { stroke: var(--muted-foreground); stroke-width:1.2; fill:none; stroke-dasharray:2 3; opacity:.8; }
  .num   { font-size:10px; font-weight:700; fill:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
<svg width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="var(--muted-foreground)"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="var(--foreground)" opacity=".65"/></marker>
  </defs>

  <!-- ─────────── HUMAN ─────────── -->
  <text x="0" y="14" class="hdr">HUMAN</text>
  <rect x="0" y="24" width="250" height="60" class="entry"/>
  <text x="14" y="46" class="lbl">You</text>
  <text x="14" y="64" class="sub">outcome · client owner · budget</text>
  <text x="14" y="78" class="tiny">hermes -p engagement-lead chat</text>

  <text x="272" y="47" class="num">1</text>
  <path class="flow" d="M250,54 L330,54"/>
  <text x="272" y="72" class="tiny">one sentence</text>

  <!-- ─────────── ENTRY POINT ─────────── -->
  <text x="340" y="14" class="hdr">ENTRY POINT · the only bot you talk to</text>
  <rect x="340" y="24" width="300" height="86" class="entry"/>
  <text x="354" y="46" class="lbl">engagement-lead</text>
  <text x="354" y="64" class="sub">intake · decompose · route · report</text>
  <text x="354" y="80" class="tiny">skill: running-an-engagement</text>
  <text x="354" y="94" class="tiny">tool: bin/kanban-budget.py</text>
  <text x="354" y="106" class="tiny">kanban on cli + desktop</text>

  <!-- budget -->
  <rect x="672" y="24" width="204" height="86" class="box"/>
  <text x="686" y="46" class="lbl">Budget ledger</text>
  <text x="686" y="63" class="tiny">task_runs.profile + time window</text>
  <text x="686" y="76" class="tiny">↔ profiles/&lt;p&gt;/state.db</text>
  <text x="686" y="89" class="tiny">exit 0 ok · 1 reserve · 2 over</text>
  <text x="686" y="103" class="tiny">checkpoints 25 / 50 / 75%</text>
  <path class="read" d="M640,67 L672,67"/>

  <text x="600" y="132" class="num">2</text>
  <path class="flow" d="M490,110 L490,152"/>
  <text x="500" y="132" class="sub">writes cards</text>

  <!-- ─────────── BOARD ─────────── -->
  <text x="0" y="150" class="hdr">BOARD · one per engagement (hard isolation)</text>
  <rect x="0" y="160" width="876" height="96" class="board"/>
  <text x="16" y="182" class="lbl">hermes kanban · board “acme-portal”</text>
  <text x="16" y="200" class="sub">cards carry: outcome · testable acceptance criteria · workspace dir:/repo · budget · parent links</text>

  <rect x="16" y="210" width="150" height="34" class="box"/>
  <text x="26" y="231" class="tiny">todo → ready</text>
  <rect x="176" y="210" width="150" height="34" class="box"/>
  <text x="186" y="231" class="tiny">running</text>
  <rect x="336" y="210" width="150" height="34" class="box"/>
  <text x="346" y="231" class="tiny">review</text>
  <rect x="496" y="210" width="150" height="34" class="box"/>
  <text x="506" y="231" class="tiny">blocked (needs owner)</text>
  <rect x="656" y="210" width="204" height="34" class="box"/>
  <text x="666" y="231" class="tiny">done — QA-accepted only</text>

  <text x="600" y="280" class="num">3</text>
  <path class="flow" d="M438,256 L438,300"/>
  <text x="448" y="281" class="sub">dispatcher claims atomically, spawns the assignee</text>

  <!-- ─────────── DISPATCHER ─────────── -->
  <rect x="230" y="300" width="420" height="44" class="box"/>
  <text x="244" y="320" class="lbl">Dispatcher</text>
  <text x="244" y="336" class="tiny">runs inside the gateway (~60s) · HERMES_KANBAN_BOARD pinned per worker</text>

  <text x="600" y="368" class="num">4</text>
  <path class="flow" d="M438,344 L438,392"/>

  <!-- ─────────── WORKERS ─────────── -->
  <text x="0" y="386" class="hdr">SPECIALISTS · spawned per card, isolated workspace</text>
  <rect x="0" y="396" width="876" height="196" class="lane"/>

  <!-- row 1 -->
  <rect x="14" y="410" width="160" height="52" class="box"/>
  <text x="24" y="430" class="lbl">business-analyst</text>
  <text x="24" y="447" class="tiny">requirements, criteria</text>

  <rect x="184" y="410" width="160" height="52" class="box"/>
  <text x="194" y="430" class="lbl">domain-consultant</text>
  <text x="194" y="447" class="tiny">the vertical's rules</text>

  <rect x="354" y="410" width="160" height="52" class="box"/>
  <text x="364" y="430" class="lbl">solution-architect</text>
  <text x="364" y="447" class="tiny">boundaries, one-way doors</text>

  <rect x="524" y="410" width="160" height="52" class="box"/>
  <text x="534" y="430" class="lbl">app-engineer</text>
  <text x="534" y="447" class="tiny">builds the feature</text>

  <rect x="694" y="410" width="168" height="52" class="box"/>
  <text x="704" y="430" class="lbl">qa-lead</text>
  <text x="704" y="447" class="tiny">evidence, Playwright e2e</text>

  <!-- row 2 -->
  <rect x="14" y="476" width="160" height="52" class="box"/>
  <text x="24" y="496" class="lbl">integration-eng.</text>
  <text x="24" y="513" class="tiny">interfaces, migration</text>

  <rect x="184" y="476" width="160" height="52" class="box"/>
  <text x="194" y="496" class="lbl">platform-sre</text>
  <text x="194" y="513" class="tiny">pipelines, runbooks</text>

  <rect x="354" y="476" width="160" height="52" class="box"/>
  <text x="364" y="496" class="lbl">security-compliance</text>
  <text x="364" y="513" class="tiny">threat model, evidence</text>

  <rect x="524" y="476" width="160" height="52" class="box"/>
  <text x="534" y="496" class="lbl">presales-writer</text>
  <text x="534" y="513" class="tiny">SOW, status, handover</text>

  <rect x="694" y="476" width="168" height="52" class="box"/>
  <text x="704" y="496" class="lbl">delivery-manager</text>
  <text x="704" y="513" class="tiny">sub-plans, sequencing</text>

  <!-- peer delegation: app-engineer -> qa-lead -->
  <text x="600" y="480" class="num">5</text>
  <path class="peer" d="M684,436 L694,436"/>
  <text x="534" y="548" class="sub">peer delegation — kanban_create + kanban_link, e.g.</text>
  <text x="534" y="563" class="tiny">app-engineer → qa-lead “write the e2e suite”  (verified: 4/4 passing)</text>
  <text x="534" y="578" class="tiny">parent cannot reach done while a child card is open</text>

  <text x="14" y="548" class="sub">every worker must end on kanban_complete or kanban_block</text>
  <text x="14" y="563" class="tiny">exiting without one = protocol violation → retried → blocked</text>
  <text x="14" y="578" class="tiny">tools: kanban_create · link · comment · request_review · block</text>

  <!-- ─────────── return paths ─────────── -->
  <text x="908" y="150" class="num">6</text>
  <path class="back" d="M876,208 C960,208 960,470 876,470"/>
  <text x="884" y="330" class="sub">results,</text>
  <text x="884" y="346" class="sub">review</text>
  <text x="884" y="362" class="sub">requests</text>

  <text x="908" y="40" class="num">7</text>
  <path class="back" d="M876,190 C976,190 976,60 640,60"/>

  <!-- escalation -->
  <rect x="0" y="620" width="420" height="62" class="box"/>
  <text x="14" y="641" class="lbl">Escalation — never overridden internally</text>
  <text x="14" y="658" class="sub">a refusal on security / data integrity / accessibility / regulation</text>
  <text x="14" y="673" class="tiny">worker → engagement-lead → the named client owner (a human)</text>
  <path class="back" d="M210,620 L210,592"/>
  <path class="back" d="M0,650 C-40,650 -40,54 0,54" transform="translate(6,0)"/>

  <!-- memory -->
  <rect x="446" y="620" width="430" height="62" class="box"/>
  <text x="460" y="641" class="lbl">One shared Mnemosyne bank</text>
  <text x="460" y="658" class="sub">all 11 profiles → ~/.hermes/mnemosyne (symlinked data root)</text>
  <text x="460" y="673" class="tiny">the analyst's assumption is the one QA tests against</text>
  <path class="read" d="M660,620 L660,592"/>

  <!-- legend -->
  <text x="0" y="716" class="hdr">LEGEND</text>
  <path class="flow" d="M76,712 L116,712"/>
  <text x="122" y="716" class="tiny">card flow / dispatch</text>
  <path class="back" d="M250,712 L290,712"/>
  <text x="296" y="716" class="tiny">results &amp; escalation back up</text>
  <path class="peer" d="M486,712 L526,712"/>
  <text x="532" y="716" class="tiny">peer delegation between specialists</text>
  <path class="read" d="M760,712 L800,712"/>
  <text x="806" y="716" class="tiny">reads (cost, memory)</text>

  <text x="0" y="744" class="tiny">You only ever talk to engagement-lead. Everything below it is spawned by the dispatcher and reports back through the board.</text>
</svg>
</div>
</body>
</html>
