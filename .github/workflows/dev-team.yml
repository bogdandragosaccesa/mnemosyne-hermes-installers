name: dev-team

on:
  push:
    branches:
      - autonomous-dev-team
      - main
  pull_request:
    branches:
      - main
      - autonomous-dev-team

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: forge unit tests
        run: python3 -m unittest discover -s dev-team/forge/tests

      - name: dev-team-gate unit tests
        run: python3 -m unittest discover -s dev-team/plugin/dev-team-gate/tests

      - name: deciders unit tests
        run: python3 -m unittest discover -s dev-team/deciders/tests

      - name: scripts unit tests (stdlib-only venv)
        # The checker's own suite (env_pin_check.py, kanban-budget.py) must
        # pass with the standard library alone: no python-dotenv, no pwsh,
        # no Mnemosyne venv. Any test that needs one of those skips cleanly
        # with a reason instead of failing. python3 -I additionally ignores
        # user site-packages and PYTHON* env vars.
        run: |
          python3 -m venv --without-pip /tmp/dev-team-scripts-stdlib-venv
          /tmp/dev-team-scripts-stdlib-venv/bin/python3 -I -m unittest discover -s dev-team/scripts/tests -v

  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hermes (non-interactive)
        run: curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash -s -- --non-interactive

      - name: Put hermes on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Mnemosyne memory
        run: ./install-mnemosyne-hermes-unix.sh --disable-builtin-memory
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create qa collision canary (old-team profile name)
        run: hermes profile create qa --clone

      - name: Record qa SOUL.md hash before dev-team install
        id: qa_soul_before
        run: |
          qa_dir="$(dirname "$(hermes -p qa config path)")"
          hash="$(sha256sum "$qa_dir/SOUL.md" | awk '{print $1}')"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "qa SOUL.md before: $hash"

      - name: dev-team install --dry-run changes nothing
        run: |
          dev-team/install-dev-team-unix.sh --skip-model --dry-run
          if hermes profile show dev-qa >/dev/null 2>&1; then
            echo "::error::--dry-run created a profile" >&2
            exit 1
          fi

      - name: dev-team install (run 1)
        # Brief item 11: the first run on a fresh machine exited 1 while the
        # plugin was in fact enabled (a race with the plugin reload).
        run: |
          if ! dev-team/install-dev-team-unix.sh --skip-model; then
            echo "::error::first run must exit 0 on a fresh machine" >&2
            exit 1
          fi

      - name: dev-team install (run 2, idempotency)
        run: dev-team/install-dev-team-unix.sh --skip-model

      - name: dev-team install --only qa (run 3, partial re-run)
        run: dev-team/install-dev-team-unix.sh --skip-model --only qa

      - name: every dev-* profile links the team-only Mnemosyne bank
        # Brief item 10: profiles this installer creates share one bank --
        # the TEAM bank ($HERMES_ROOT/dev-team-mnemosyne), never the
        # operator's own ($HERMES_ROOT/mnemosyne). The check lives in a
        # script so the unit suite can run it (test_ci_team_bank_checks.py):
        # it fails if the banks resolve to each other or any profile's link
        # resolves anywhere but the team bank, then creates the team DB
        # through dev-architect's own .env pins (nothing in an install
        # creates it -- red run 41632104823) and requires it to land in the
        # team bank with the operator's DB unchanged.
        run: |
          root="$(dirname "$(hermes config path)")"
          profiles=()
          for role in pm architect uiux backend-db frontend qa reviewer devops; do
            profiles+=("dev-$role=$(dirname "$(hermes -p "dev-$role" config path)")")
          done
          bash .github/scripts/check-team-bank.sh --root "$root" \
            --cli "$HOME/.mnemosyne-venv/bin/mnemosyne" --init dev-architect "${profiles[@]}"

      - name: every dev-* profile records its team prefix
        run: |
          for role in pm architect uiux backend-db frontend qa reviewer devops; do
            dir="$(dirname "$(hermes -p "dev-$role" config path)")"
            got="$(cat "$dir/dev-team-prefix")"
            if [ "$got" != "dev-" ]; then
              echo "::error::dev-$role: dev-team-prefix is '$got', expected 'dev-'" >&2
              exit 1
            fi
          done

      - name: test_prefix_isolation — qa SOUL.md hash is unchanged
        run: |
          qa_dir="$(dirname "$(hermes -p qa config path)")"
          hash="$(sha256sum "$qa_dir/SOUL.md" | awk '{print $1}')"
          echo "qa SOUL.md after: $hash"
          if [ "$hash" != "${{ steps.qa_soul_before.outputs.hash }}" ]; then
            echo "::error::qa profile's SOUL.md changed — dev-team install touched an unprefixed profile it must never touch." >&2
            exit 1
          fi

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hermes (non-interactive)
        shell: pwsh
        run: '& ([scriptblock]::Create((irm https://hermes-agent.nousresearch.com/install.ps1))) -NonInteractive'

      - name: Refresh PATH for this job
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $refreshed = ($machine, $user -join ';')
          Add-Content -Path $env:GITHUB_PATH -Value ($refreshed -split ';' | Where-Object { $_ })

      - name: Install Mnemosyne memory
        shell: pwsh
        run: .\install-mnemosyne-hermes-windows.ps1 -DisableBuiltinMemory
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create qa collision canary (old-team profile name)
        shell: pwsh
        run: hermes profile create qa --clone

      - name: Record qa SOUL.md hash before dev-team install
        id: qa_soul_before
        shell: pwsh
        run: |
          $qaDir = Split-Path -Parent (hermes -p qa config path | Select-Object -Last 1)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $qaDir 'SOUL.md')).Hash
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "qa SOUL.md before: $hash"

      - name: dev-team install (run 1)
        shell: pwsh
        run: dev-team\install-dev-team-windows.ps1 -SkipModel

      - name: dev-team install (run 2, idempotency)
        shell: pwsh
        run: dev-team\install-dev-team-windows.ps1 -SkipModel

      - name: every dev-* profile records its team prefix
        shell: pwsh
        run: |
          foreach ($role in 'pm','architect','uiux','backend-db','frontend','qa','reviewer','devops') {
            $dir = Split-Path -Parent (hermes -p "dev-$role" config path | Select-Object -Last 1)
            $got = (Get-Content -LiteralPath (Join-Path $dir 'dev-team-prefix') -Raw).Trim()
            if ($got -ne 'dev-') { Write-Error "dev-$role : dev-team-prefix is '$got', expected 'dev-'"; exit 1 }
          }

      - name: test_prefix_isolation — qa SOUL.md hash is unchanged
        shell: pwsh
        run: |
          $qaDir = Split-Path -Parent (hermes -p qa config path | Select-Object -Last 1)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $qaDir 'SOUL.md')).Hash
          Write-Host "qa SOUL.md after: $hash"
          if ($hash -ne '${{ steps.qa_soul_before.outputs.hash }}') {
            Write-Error "qa profile's SOUL.md changed -- dev-team install touched an unprefixed profile it must never touch."
            exit 1
          }

  # Review #2: on Windows PowerShell 5.1, `Remove-Item -Recurse` on a junction
  # deletes the TARGET's contents, so a re-run used to wipe the shared
  # Mnemosyne bank and the plugin source through the profile links. The
  # installer is run twice under 5.1 itself (`shell: powershell`, not pwsh),
  # then the link targets are checked to still be there.
  install-windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hermes (non-interactive)
        shell: powershell
        run: '& ([scriptblock]::Create((irm https://hermes-agent.nousresearch.com/install.ps1))) -NonInteractive'

      - name: Refresh PATH for this job
        shell: powershell
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $refreshed = ($machine, $user -join ';')
          Add-Content -Path $env:GITHUB_PATH -Value ($refreshed -split ';' | Where-Object { $_ })

      - name: Install Mnemosyne memory
        shell: powershell
        run: .\install-mnemosyne-hermes-windows.ps1 -DisableBuiltinMemory
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Runs under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Error "expected 5.1, got $($PSVersionTable.PSVersion)"; exit 1 }

      # D6 (review): the scan loop and the junction relink had no test
      # exercising them, even with pwsh. Build a junction-based old team
      # home under dev-pm (mirroring the historical T4 bug: a profile's
      # dev-team junction pointing at a real directory that still holds
      # the live data) before the first real run, so that run has to
      # detect and migrate it.
      - name: Build a junction-based old team home under dev-pm (D6)
        shell: powershell
        run: |
          hermes profile create dev-pm --clone
          $pmDir = Split-Path -Parent (hermes -p dev-pm config path | Select-Object -Last 1)
          # Under a (builder) profile directory on the Hermes root's own volume:
          # the real bug shape (profiles\<builder>\dev-team), and same-volume,
          # so the atomic-move path is what runs (RUNNER_TEMP is on D:).
          $oldHome = Join-Path (Split-Path -Parent $pmDir) 'ci-builder\dev-team'
          New-Item -ItemType Directory -Path $oldHome -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $oldHome 'deciders-ledger.jsonl') -Value 'ledger-data' -NoNewline
          New-Item -ItemType Junction -Path (Join-Path $pmDir 'dev-team') -Target $oldHome | Out-Null
          "OLD_TEAM_HOME=$oldHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PM_DIR=$pmDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: dev-team install (run 1, 5.1)
        shell: powershell
        run: |
          dev-team\install-dev-team-windows.ps1 -SkipModel
          if ($LASTEXITCODE -ne 0) { Write-Error "first run must exit 0 on a fresh machine"; exit 1 }

      - name: junction-based old home migrated to the root (D6)
        shell: powershell
        run: |
          $root = Split-Path -Parent (hermes config path | Select-Object -Last 1)
          $newHome = Join-Path $root 'dev-team'
          $ledger = Join-Path $newHome 'deciders-ledger.jsonl'
          if (-not (Test-Path -LiteralPath $ledger)) { Write-Error "D6: data did not move to the root ($ledger missing)"; exit 1 }
          if ((Get-Content -LiteralPath $ledger -Raw).Trim() -ne 'ledger-data') { Write-Error "D6: ledger content lost in migration"; exit 1 }

          $pmLink = Get-Item -LiteralPath (Join-Path $env:PM_DIR 'dev-team') -Force
          if (-not $pmLink.LinkType) { Write-Error "D6: dev-pm/dev-team is not a junction after migration"; exit 1 }
          $pmTarget = (($pmLink.Target | Select-Object -First 1)).TrimEnd('\')
          if ($pmTarget -ne $newHome.TrimEnd('\')) { Write-Error "D6: dev-pm/dev-team junction points at $pmTarget, not the root $newHome"; exit 1 }

          # D3: the old physical path must still resolve, through a junction left behind.
          if (-not (Test-Path -LiteralPath $env:OLD_TEAM_HOME)) { Write-Error "D3: old path $env:OLD_TEAM_HOME no longer resolves"; exit 1 }
          $oldItem = Get-Item -LiteralPath $env:OLD_TEAM_HOME -Force
          if (-not $oldItem.LinkType) { Write-Error "D3: old path is not a junction after migration"; exit 1 }
          if ((Get-Content -LiteralPath (Join-Path $env:OLD_TEAM_HOME 'deciders-ledger.jsonl') -Raw).Trim() -ne 'ledger-data') {
            Write-Error "D3: old path no longer resolves to the data"; exit 1
          }

          # The backup must be intact.
          $backupParent = Split-Path -Parent $env:OLD_TEAM_HOME
          $backup = Get-ChildItem -Path $backupParent -Filter 'dev-team.pre-root-migration-*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $backup) { Write-Error "D6: no backup directory found under $backupParent"; exit 1 }
          if ((Get-Content -LiteralPath (Join-Path $backup.FullName 'deciders-ledger.jsonl') -Raw).Trim() -ne 'ledger-data') {
            Write-Error "D6: backup is missing or corrupt"; exit 1
          }

      - name: dev-team install (run 2, 5.1 - replaces every link)
        shell: powershell
        run: |
          dev-team\install-dev-team-windows.ps1 -SkipModel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: link targets survived the re-run
        shell: powershell
        run: |
          $root = Split-Path -Parent (hermes config path | Select-Object -Last 1)
          $guard = Join-Path $env:GITHUB_WORKSPACE 'dev-team\plugin\dev-team-gate\guard.py'
          if (-not (Test-Path -LiteralPath $guard)) { Write-Error "plugin source is gone: $guard"; exit 1 }
          $profileDirs = @()
          foreach ($role in 'pm','architect','uiux','backend-db','frontend','qa','reviewer','devops') {
            $dir = Split-Path -Parent (hermes -p "dev-$role" config path | Select-Object -Last 1)
            $linked = Join-Path $dir 'plugins\dev-team-gate\guard.py'
            if (-not (Test-Path -LiteralPath $linked)) { Write-Error "dev-$role : $linked missing"; exit 1 }
            $profileDirs += "dev-$role=$dir"
          }
          # The team-only bank (dev-team-next Task 2), never the operator's
          # own. The check lives in a script the unit suite runs under pwsh
          # (test_ci_team_bank_checks.py). It compares REAL link targets (C2:
          # Resolve-Path follows no junction), requires every profile's link
          # to resolve to the team bank (C3), and creates the team DB through
          # dev-architect's own .env pins before requiring it (C1: nothing in
          # an install creates it -- red run 41632104823). dev-pm was made by
          # `hermes profile create --clone` before the installer ran, so it
          # keeps its own real bank by design (no -AdoptTeamMemory here):
          # asserted as private, not shared (C4).
          $cli = Join-Path $env:USERPROFILE '.mnemosyne-venv\Scripts\mnemosyne.exe'
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\check-team-bank.ps1') `
            -HermesRoot $root -MnemosyneCli $cli -InitProfile 'dev-architect' `
            -ProfileDir $profileDirs -PrivateProfile @('dev-pm')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python for the Windows-only unit tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # A3 (PR #9 follow-ups): cmd.exe, Windows PowerShell 5.1 and a UTF-16
      # environment block exist only on this runner. Proves, under 5.1, that
      # the .env pin checker gets the value exact, and that forge.cmd /
      # deciders.cmd refuse a non-ASCII path instead of being written
      # corrupted (dev-team/plugin/dev-team-gate/tests/test_install_windows_nt.py).
      - name: Windows-only env-pin and cmd-wrapper evidence (A3)
        shell: powershell
        run: |
          python -m unittest discover -v -s dev-team/plugin/dev-team-gate/tests -p test_install_windows_nt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
